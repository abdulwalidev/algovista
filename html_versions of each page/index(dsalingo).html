<!DOCTYPE html>
<html lang="en">
<head>
//b.
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DSAlingo — Learn Algorithms</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{
  --red:#e53935;--rg:rgba(229,57,53,0.45);
  --bg:#0a0a0a;--card:#111;--card2:#131313;--border:#1e1e1e;--border2:#252525;
  --text:#f0f0f0;--text2:#b0b0b0;--muted:#555;--muted2:#666;
  --green:#22c55e;--blue:#4facfe;--gold:#f59e0b;
  --sidebar-w:220px;--right-w:320px;
}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--text);font-family:'Nunito Sans',sans-serif;min-height:100vh;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(229,57,53,0.015) 1px,transparent 1px),linear-gradient(90deg,rgba(229,57,53,0.015) 1px,transparent 1px);background-size:56px 56px;pointer-events:none;z-index:0;}
.page{display:none;min-height:100vh;position:relative;z-index:1;}
.page.active{display:block;}
.page.flex-page{display:none;flex-direction:column;}
.page.flex-page.active{display:flex;}
.app-page{display:none;}
.app-page.active{display:flex;min-height:100vh;}

/* SIDEBAR */
.sidebar{width:var(--sidebar-w);background:rgba(10,10,10,0.98);border-right:1.5px solid var(--border);position:fixed;top:0;left:0;height:100vh;display:flex;flex-direction:column;padding:16px 12px;z-index:200;}
.sidebar-logo{display:flex;align-items:center;gap:10px;font-family:'Nunito',sans-serif;font-weight:900;font-size:1.15rem;color:var(--text);padding:8px 12px 20px;cursor:pointer;border-bottom:1px solid var(--border);margin-bottom:12px;}
.sidebar-logo-icon{width:30px;height:30px;background:var(--red);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.85rem;box-shadow:0 0 12px var(--rg);flex-shrink:0;}
.nav-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:10px;cursor:pointer;transition:all .15s;color:var(--muted2);font-family:'Nunito',sans-serif;font-weight:800;font-size:.75rem;letter-spacing:1.2px;text-transform:uppercase;margin-bottom:2px;border:1.5px solid transparent;}
.nav-item:hover{color:var(--text);background:rgba(255,255,255,.05);}
.nav-item.active{color:var(--red);background:rgba(229,57,53,.08);border-color:rgba(229,57,53,.2);}
.nav-item-icon{font-size:1.1rem;width:22px;text-align:center;flex-shrink:0;}
.sidebar-bottom{margin-top:auto;padding-top:12px;border-top:1px solid var(--border);}
.sidebar-user{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer;transition:all .15s;}
.sidebar-user:hover{background:rgba(255,255,255,.05);}
.sidebar-avatar{width:34px;height:34px;background:var(--red);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.95rem;flex-shrink:0;border:2px solid rgba(229,57,53,.4);}
.sidebar-user-name{font-family:'Nunito',sans-serif;font-weight:800;font-size:.78rem;}
.sidebar-user-sub{font-size:.62rem;color:var(--muted2);}
.sidebar-stats{display:flex;gap:8px;padding:8px 12px;margin-bottom:4px;}
.ss-item{flex:1;text-align:center;background:rgba(255,255,255,.04);border-radius:8px;padding:6px 4px;}
.ss-val{font-family:'Nunito',sans-serif;font-weight:900;font-size:.9rem;}
.ss-val.red{color:var(--red);}
.ss-val.orange{color:#fb923c;}
.ss-lbl{font-size:.52rem;color:var(--muted2);letter-spacing:.5px;text-transform:uppercase;margin-top:1px;}

/* MAIN */
.main-content{margin-left:var(--sidebar-w);flex:1;padding:32px 28px;max-width:860px;}
.main-with-right{margin-left:var(--sidebar-w);margin-right:var(--right-w);flex:1;padding:32px 28px;}

/* RIGHT PANEL */
.right-panel{width:var(--right-w);position:fixed;right:0;top:0;height:100vh;background:rgba(10,10,10,0.95);border-left:1.5px solid var(--border);padding:28px 20px;display:flex;flex-direction:column;gap:14px;overflow-y:auto;z-index:100;}
.rp-card{background:var(--card2);border:1.5px solid var(--border);border-radius:14px;padding:16px;}
.rp-card h3{font-family:'Nunito',sans-serif;font-weight:800;font-size:.88rem;margin-bottom:12px;}
.rp-badge-header{background:linear-gradient(135deg,rgba(229,57,53,.12),rgba(229,57,53,.04));border:1.5px solid rgba(229,57,53,.25);border-radius:14px;padding:16px;}
.rp-badge-header h3{color:var(--red);margin-bottom:4px;}
.rp-badge-header p{font-size:.72rem;color:var(--muted2);line-height:1.5;}
.rp-lock-icon{width:42px;height:42px;background:rgba(255,255,255,.06);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;margin-bottom:10px;}
.quest-item{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
.quest-icon{font-size:1.3rem;width:36px;height:36px;background:rgba(245,158,11,.1);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.quest-info{flex:1;}
.quest-name{font-family:'Nunito',sans-serif;font-weight:700;font-size:.78rem;margin-bottom:4px;}
.quest-bar-track{height:6px;background:#1a1a1a;border-radius:99px;overflow:hidden;}
.quest-bar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--red),#ff6b6b);}
.quest-progress-text{font-size:.65rem;color:var(--muted2);margin-top:3px;}
.rp-action-btns{display:flex;flex-direction:column;gap:6px;margin-top:8px;}
.rp-btn-primary{background:var(--red);color:#fff;border:none;padding:10px;border-radius:8px;font-family:'Nunito',sans-serif;font-weight:800;font-size:.72rem;letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:all .15s;box-shadow:0 2px 10px var(--rg);}
.rp-btn-primary:hover{transform:translateY(-1px);}
.rp-btn-secondary{background:transparent;color:var(--text2);border:1.5px solid var(--border2);padding:9px;border-radius:8px;font-family:'Nunito',sans-serif;font-weight:700;font-size:.72rem;letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:all .15s;}
.rp-btn-secondary:hover{border-color:#444;background:rgba(255,255,255,.04);}
.streak-mini{display:flex;gap:5px;margin-top:10px;}
.sm-day{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:.5rem;font-weight:700;letter-spacing:.4px;text-transform:uppercase;}
.sm-done{background:rgba(229,57,53,.25);color:var(--red);border:1px solid rgba(229,57,53,.3);}
.sm-today{background:var(--red);color:#fff;}
.sm-empty{background:#111;border:1px solid #1a1a1a;color:var(--muted);}
.view-all-link{font-size:.65rem;color:var(--red);cursor:pointer;font-weight:700;letter-spacing:.5px;text-transform:uppercase;}

/* LANDING */
#p1{display:none;}
#p1.active{display:flex;flex-direction:column;}
.lp-nav{display:flex;align-items:center;justify-content:space-between;padding:16px 52px;border-bottom:1px solid var(--border);background:rgba(10,10,10,0.96);backdrop-filter:blur(16px);position:sticky;top:0;z-index:500;}
.lp-logo{display:flex;align-items:center;gap:10px;font-family:'Nunito',sans-serif;font-weight:900;font-size:1.3rem;color:var(--text);cursor:pointer;}
.lp-logo-icon{width:32px;height:32px;background:var(--red);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.9rem;box-shadow:0 0 14px var(--rg);}
.lp-nav-right{display:flex;align-items:center;gap:14px;}
.lp-nav-link{font-size:.72rem;letter-spacing:1.4px;color:var(--muted2);text-transform:uppercase;cursor:pointer;transition:color .15s;font-weight:700;}
.lp-nav-link:hover{color:var(--text);}
.lp-nav-btn{background:var(--red);color:#fff;border:none;padding:8px 18px;border-radius:8px;font-family:'Nunito',sans-serif;font-weight:800;font-size:.72rem;letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:all .15s;box-shadow:0 2px 10px var(--rg);}
.lp-hero{flex:1;display:flex;align-items:center;justify-content:center;padding:60px 52px;gap:80px;}
.lp-cluster{position:relative;width:400px;height:360px;flex-shrink:0;}
.lp-cluster::before{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:250px;height:250px;background:radial-gradient(circle,rgba(229,57,53,.2) 0%,transparent 70%);border-radius:50%;animation:glow 3s ease-in-out infinite;}
@keyframes glow{0%,100%{opacity:.6;transform:translate(-50%,-50%) scale(1)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}}
.fnode{position:absolute;border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:'Courier New',monospace;font-weight:700;animation:fnfloat linear infinite;}
@keyframes fnfloat{0%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-8px) rotate(var(--r,0deg))}100%{transform:translateY(0) rotate(var(--r,0deg))}}
.fn-main{width:96px;height:96px;background:#180000;border:2px solid var(--red);box-shadow:0 0 28px var(--rg),inset 0 0 18px rgba(229,57,53,.1);font-size:2.2rem;color:var(--red);top:50%;left:50%;transform:translate(-50%,-50%);animation-duration:4s;z-index:5;border-radius:50%;}
.fn-a{width:64px;height:64px;background:#0f0f0f;border:1.5px solid #2a2a2a;color:#888;font-size:.62rem;top:5%;left:6%;animation-duration:5s;--r:-8deg;}
.fn-b{width:52px;height:52px;background:#0f0f0f;border:1.5px solid #242424;color:#666;font-size:.6rem;top:3%;right:12%;animation-duration:6.5s;animation-delay:-1s;--r:6deg;}
.fn-c{width:70px;height:70px;background:#0e0000;border:1.5px solid #4a0f0f;color:#b44;font-size:1.2rem;top:17%;right:3%;animation-duration:5.5s;animation-delay:-2s;--r:12deg;}
.fn-d{width:56px;height:56px;background:#0f0f0f;border:1.5px solid #1f1f1f;color:#555;font-size:.6rem;bottom:20%;left:3%;animation-duration:7s;animation-delay:-3s;--r:-10deg;}
.fn-e{width:48px;height:48px;background:#0c0c0c;border:1.5px solid #1c1c1c;color:#444;font-size:.95rem;bottom:9%;right:14%;animation-duration:4.5s;animation-delay:-.5s;--r:4deg;}
.fn-f{width:42px;height:42px;background:#0e0000;border:1.5px solid #300707;color:#744;font-size:.56rem;bottom:28%;right:1%;animation-duration:8s;animation-delay:-4s;--r:-5deg;}
.fn-g{width:50px;height:50px;background:#0f0f0f;border:1.5px solid #1c1c1c;color:#444;font-size:.9rem;top:40%;left:-3%;animation-duration:6s;animation-delay:-2.5s;--r:8deg;}
.fnl{font-family:'Courier New',monospace;font-size:.5rem;text-align:center;line-height:1.4;}
.lp-hero-r{max-width:400px;}
.lp-hero-r h1{font-family:'Nunito',sans-serif;font-weight:900;font-size:clamp(2rem,3.8vw,3rem);line-height:1.05;margin-bottom:10px;letter-spacing:-1px;}
.lp-hero-r h1 span{color:var(--red);text-shadow:0 0 18px var(--rg);}
.lp-tagline{color:var(--muted2);font-size:.9rem;margin-bottom:28px;line-height:1.65;}
.lp-stats{display:flex;gap:22px;margin-bottom:30px;}
.lp-stat-n{font-family:'Nunito',sans-serif;font-weight:900;font-size:1.4rem;color:var(--red);}
.lp-stat-l{font-size:.65rem;color:var(--muted2);letter-spacing:.5px;}
.lp-btns{display:flex;flex-direction:column;gap:10px;max-width:340px;}
.btn-primary{background:var(--red);color:#fff;border:none;padding:14px 20px;border-radius:12px;font-family:'Nunito',sans-serif;font-weight:800;font-size:.85rem;letter-spacing:1.2px;text-transform:uppercase;cursor:pointer;width:100%;transition:all .15s;box-shadow:0 4px 20px var(--rg);animation:bpulse 3s ease-in-out infinite;}
@keyframes bpulse{0%,100%{box-shadow:0 4px 20px var(--rg)}50%{box-shadow:0 6px 32px rgba(229,57,53,.7)}}
.btn-primary:hover{transform:translateY(-2px);}
.btn-secondary{background:transparent;color:var(--text);border:2px solid #282828;padding:13px 20px;border-radius:12px;font-family:'Nunito',sans-serif;font-weight:800;font-size:.85rem;letter-spacing:1.2px;text-transform:uppercase;cursor:pointer;width:100%;transition:all .15s;}
.btn-secondary:hover{border-color:#444;background:#0f0f0f;transform:translateY(-1px);}

/* AUTH */
#p2,#p3,#p14{display:none;flex-direction:column;}
#p2.active,#p3.active,#p14.active{display:flex;}
.auth-nav{display:flex;align-items:center;justify-content:space-between;padding:14px 48px;border-bottom:1px solid var(--border);background:rgba(10,10,10,0.96);}
.auth-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:48px 24px;}
.auth-card{background:var(--card2);border:1.5px solid var(--border);border-radius:20px;padding:40px;width:100%;max-width:420px;}
.auth-card h2{font-family:'Nunito',sans-serif;font-weight:900;font-size:1.6rem;margin-bottom:6px;}
.auth-sub{color:var(--muted2);font-size:.84rem;margin-bottom:28px;}
.auth-sub a{color:var(--red);cursor:pointer;}
.form-group{margin-bottom:16px;}
.form-group label{display:block;font-size:.72rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted2);margin-bottom:7px;}
.form-group input{width:100%;background:#0d0d0d;border:1.5px solid var(--border2);border-radius:9px;padding:11px 14px;color:var(--text);font-family:'Nunito Sans',sans-serif;font-size:.88rem;outline:none;transition:border-color .2s;}
.form-group input:focus{border-color:rgba(229,57,53,.5);}
.form-group input::placeholder{color:var(--muted);}
.auth-divider{display:flex;align-items:center;gap:12px;margin:18px 0;color:var(--muted);font-size:.75rem;}
.auth-divider::before,.auth-divider::after{content:'';flex:1;height:1px;background:var(--border);}
.auth-terms{font-size:.7rem;color:var(--muted);text-align:center;margin-top:14px;line-height:1.5;}
.auth-terms a{color:var(--red);cursor:pointer;}
.social-btn{width:100%;background:var(--card);border:1.5px solid var(--border2);border-radius:9px;padding:10px;color:var(--text2);font-family:'Nunito Sans',sans-serif;font-size:.83rem;font-weight:600;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:9px;margin-bottom:10px;}
.social-btn:hover{border-color:#333;background:#151515;}
.auth-full-btn{background:var(--red);color:#fff;border:none;padding:13px 20px;border-radius:10px;font-family:'Nunito',sans-serif;font-weight:800;font-size:.82rem;letter-spacing:1px;text-transform:uppercase;cursor:pointer;width:100%;margin-top:8px;transition:all .15s;box-shadow:0 3px 14px var(--rg);}
.auth-full-btn:hover{transform:translateY(-1px);}
.forgot-link{text-align:center;margin-top:12px;}
.forgot-link a{font-size:.75rem;color:var(--red);cursor:pointer;font-weight:600;}

/* SETUP */
#p4{display:none;flex-direction:column;}
#p4.active{display:flex;}
.setup-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 24px;}
.setup-card{background:var(--card2);border:1.5px solid var(--border);border-radius:20px;padding:44px 40px;width:100%;max-width:500px;text-align:center;}
.setup-card h2{font-family:'Nunito',sans-serif;font-weight:900;font-size:1.5rem;margin-bottom:8px;}
.setup-card .setup-sub{color:var(--muted2);font-size:.84rem;margin-bottom:30px;}
.level-options{display:flex;flex-direction:column;gap:10px;margin-bottom:24px;}
.level-opt{background:#0f0f0f;border:1.5px solid var(--border2);border-radius:12px;padding:16px 18px;cursor:pointer;transition:all .18s;text-align:left;display:flex;align-items:center;gap:14px;}
.level-opt:hover,.level-opt.selected{border-color:var(--red);background:rgba(229,57,53,.06);}
.level-opt-icon{font-size:1.4rem;width:40px;text-align:center;}
.level-opt-title{font-family:'Nunito',sans-serif;font-weight:800;font-size:.9rem;}
.level-opt-desc{font-size:.72rem;color:var(--muted2);margin-top:2px;}
.level-indicator{width:10px;height:10px;border-radius:50%;background:var(--border);margin-left:auto;flex-shrink:0;transition:background .2s;}
.level-opt.selected .level-indicator{background:var(--red);box-shadow:0 0 8px var(--rg);}

/* TOPIC GRID */
.page-title{font-family:'Nunito',sans-serif;font-weight:900;font-size:1.7rem;margin-bottom:6px;}
.page-sub{color:var(--muted2);font-size:.86rem;margin-bottom:28px;}
.tgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;}
.tcard{background:var(--card2);border:1.5px solid var(--border);border-radius:14px;padding:22px 12px 16px;text-align:center;cursor:pointer;transition:all .18s;position:relative;overflow:hidden;}
.tcard::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 0%,rgba(229,57,53,.07),transparent 65%);opacity:0;transition:opacity .25s;}
.tcard:hover{border-color:rgba(229,57,53,.45);transform:translateY(-3px);box-shadow:0 10px 28px rgba(0,0,0,.5);}
.tcard:hover::after{opacity:1;}
.tcard.has-content{border-color:rgba(229,57,53,.2);}
.ti{width:56px;height:46px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;margin:0 auto 10px;position:relative;z-index:1;}
.tcard h3{font-family:'Nunito',sans-serif;font-weight:800;font-size:.82rem;margin-bottom:4px;position:relative;z-index:1;}
.tc-count{font-size:.68rem;color:var(--muted);position:relative;z-index:1;}
.tcard.has-content .tc-count{color:var(--red);}
.ic1{background:linear-gradient(135deg,#0d1520,#111e30);border:1px solid #1a2a50;}
.ic2{background:linear-gradient(135deg,#120a20,#1a1030);border:1px solid #2a1555;}
.ic3{background:linear-gradient(135deg,#150d00,#201500);border:1px solid #402800;}
.ic4{background:linear-gradient(135deg,#001212,#001e1e);border:1px solid #003535;}
.ic5{background:linear-gradient(135deg,#140000,#1e0505);border:1px solid #3a0808;}
.ic6{background:linear-gradient(135deg,#001200,#001e00);border:1px solid #003500;}
.ic7{background:linear-gradient(135deg,#130e00,#1e1500);border:1px solid #3a2800;}
.ic8{background:linear-gradient(135deg,#080820,#0f0f2e);border:1px solid #1a1a50;}
.ic9{background:linear-gradient(135deg,#140700,#201000);border:1px solid #402000;}
.ic10{background:linear-gradient(135deg,#001208,#001e10);border:1px solid #003520;}
.ic11{background:linear-gradient(135deg,#0c000c,#140014);border:1px solid #2a002a;}
.ic12{background:linear-gradient(135deg,#000c0c,#001414);border:1px solid #002a2a;}

/* LESSON LIST */
.topic-header{display:flex;align-items:center;gap:14px;margin-bottom:26px;}
.topic-icon-big{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;}
.topic-header h1{font-family:'Nunito',sans-serif;font-weight:900;font-size:1.5rem;}
.topic-header p{font-size:.76rem;color:var(--muted2);margin-top:2px;}
.section-label{font-size:.6rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin:20px 0 8px;padding-left:4px;}
.lrow{background:var(--card2);border:1.5px solid var(--border);border-radius:12px;padding:13px 17px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;transition:all .18s;margin-bottom:7px;}
.lrow:hover:not(.lrow-lock){border-color:rgba(229,57,53,.4);background:#0d0000;transform:translateX(3px);}
.lrow-lock{opacity:.35;cursor:not-allowed;}
.lrow-left{display:flex;align-items:center;gap:12px;}
.lrow-ico{width:34px;height:34px;border-radius:8px;background:#0f0f0f;border:1px solid #1e1e1e;display:flex;align-items:center;justify-content:center;font-size:.9rem;}
.lrow-info h3{font-family:'Nunito',sans-serif;font-weight:800;font-size:.83rem;margin-bottom:2px;}
.lrow-info p{font-size:.67rem;color:var(--muted2);}
.lrow-right{display:flex;align-items:center;gap:8px;}
.badge{font-size:.57rem;font-weight:700;letter-spacing:.8px;padding:3px 7px;border-radius:99px;font-family:'Nunito',sans-serif;white-space:nowrap;}
.bviz{background:rgba(229,57,53,.14);color:#ff6b6b;}
.block{background:#111;color:#2a2a2a;}
.lrow-arr{color:#2a2a2a;font-size:.8rem;}
.lrow:hover:not(.lrow-lock) .lrow-arr{color:var(--red);}

/* VIZ VIEWER */
#pViz{display:none;}
#pViz.active{display:flex;flex-direction:column;}
.viz-bar{display:flex;align-items:center;justify-content:space-between;padding:10px 24px;border-bottom:1px solid var(--border);background:rgba(8,8,8,.98);position:sticky;top:0;z-index:500;gap:14px;}
.viz-bar-l{display:flex;align-items:center;gap:12px;}
.viz-title{font-family:'Nunito',sans-serif;font-weight:800;font-size:.88rem;}
.viz-bar-r{display:flex;align-items:center;gap:10px;}
.done-btn{background:var(--red);color:#fff;border:none;padding:7px 16px;border-radius:7p
