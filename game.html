<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Quiz Runner 3D</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; touch-action: none; }
  #ui {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 10;
    font-family: 'Courier New', monospace;
  }
  #question-wrap {
    position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
    width: clamp(260px, 68vw, 620px);
  }
  #question-box {
    position: relative; overflow: hidden;
    border: 1px solid rgba(100,160,255,0.3);
    padding: 14px 24px; color: #fff;
    font-weight: bold; text-align: center;
    background: rgba(2,5,22,0.85);
    backdrop-filter: blur(6px); width: 100%;
  }
  #question-fill {
    position: absolute; top: 0; left: 0; height: 100%;
    width: 0%; pointer-events: none;
  }
  #question-text {
    position: relative; z-index: 1;
    font-size: clamp(11px, 2.3vw, 17px);
    white-space: normal; line-height: 1.45;
  }
  #progress {
    position: absolute; top: 20px; right: 24px;
    color: rgba(120,180,255,0.5); font-size: 11px; letter-spacing: 2px;
  }
  #controls {
    position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
    color: rgba(255,255,255,0.18); font-size: 11px; letter-spacing: 1px;
  }
  #end-overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: rgba(0,2,14,0.88);
    z-index: 20; opacity: 0; pointer-events: none; transition: opacity 0.6s;
  }
  #end-overlay.visible { opacity: 1; pointer-events: all; }
  #end-title { font-size: 46px; font-weight: bold; margin-bottom: 12px; color: #fff; }
  #end-sub { color: rgba(255,255,255,0.4); font-size: 14px; margin-bottom: 10px; }
  #end-score { color: #4fffb0; font-size: 24px; font-weight: bold; margin-bottom: 36px; }
  #restart-btn {
    padding: 13px 40px; background: #fff; color: #000; border: none;
    font-size: 15px; font-family: 'Courier New', monospace;
    cursor: pointer; letter-spacing: 2px; font-weight: bold; pointer-events: all;
  }
  #restart-btn:hover { background: #4fffb0; }
</style>
</head>
<body>

<div id="ui">
  <div id="progress">1 / 5</div>
  <div id="question-wrap">
    <div id="question-box">
      <div id="question-fill"></div>
      <div id="question-text"></div>
    </div>
  </div>
  <div id="controls">← → / SWIPE to move &nbsp;|&nbsp; SPACE / TAP to jump</div>
  <div id="end-overlay">
    <div id="end-title"></div>
    <div id="end-sub"></div>
    <div id="end-score"></div>
    <button id="restart-btn" onclick="restartGame()">PLAY AGAIN</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ── Questions ─────────────────────────────────────────────
const QUESTIONS = [
  { text: "Einstein's mass-energy equivalence?",  answers: ["E = uy²",       "E = mc²",      "E = qb²"],       correctIdx: 1 },
  { text: "Speed of light in vacuum?",            answers: ["3×10⁶ m/s",    "3×10⁸ m/s",   "3×10¹⁰ m/s"],   correctIdx: 1 },
  { text: "Newton's second law of motion?",       answers: ["F = mv",        "F = ma",       "F = mg"],        correctIdx: 1 },
  { text: "Unit of electric charge?",             answers: ["Ampere",        "Coulomb",      "Voltage"],       correctIdx: 1 },
  { text: "Planck's constant h = ?",              answers: ["6.63×10⁻³⁴ Js","9.1×10⁻³¹ kg","1.6×10⁻¹⁹ C"], correctIdx: 0 },
];

const READ_TIME   = 4500;
const RESULT_TIME = 4000;
const LANE_X      = [-5, 0, 5];
const WALL_START  = -130;
const WALL_SPEED  = 0.0085; // units per ms

// ── Three.js ──────────────────────────────────────────────
let W = window.innerWidth, H = window.innerHeight;

const scene    = new THREE.Scene();
scene.background = new THREE.Color(0x010109);
scene.fog        = new THREE.FogExp2(0x010109, 0.009);

const camera = new THREE.PerspectiveCamera(62, W / H, 0.1, 500);
camera.position.set(0, 9, 16);
camera.lookAt(0, 2, -10);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(W, H);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.3;
document.body.insertBefore(renderer.domElement, document.getElementById('ui'));

window.addEventListener('resize', () => {
  W = window.innerWidth; H = window.innerHeight;
  camera.aspect = W / H; camera.updateProjectionMatrix();
  renderer.setSize(W, H);
});

// ── Lights ────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0x1a2a55, 4));

const sun = new THREE.DirectionalLight(0x7799ff, 2.5);
sun.position.set(8, 30, 15);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.far = 250;
sun.shadow.camera.left = -20; sun.shadow.camera.right = 20;
scene.add(sun);

const playerLight = new THREE.PointLight(0x4488ff, 8, 14);
scene.add(playerLight);

const horizonLight = new THREE.PointLight(0x3355bb, 3, 80);
horizonLight.position.set(0, 2, -60);
scene.add(horizonLight);

// ── Stars ─────────────────────────────────────────────────
{
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(2400);
  for (let i = 0; i < 800; i++) {
    const a = Math.random() * Math.PI * 2;
    const b = Math.acos(2 * Math.random() - 1);
    const r = 160 + Math.random() * 60;
    pos[i*3]   = r * Math.sin(b) * Math.cos(a);
    pos[i*3+1] = Math.abs(r * Math.cos(b)) + 8;
    pos[i*3+2] = r * Math.sin(b) * Math.sin(a);
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  scene.add(new THREE.Points(geo, new THREE.PointsMaterial({
    color: 0xffffff, size: 0.5, transparent: true, opacity: 0.65
  })));
}

// ── Ground grid ───────────────────────────────────────────
function makeGridTex() {
  const s = 256, c = document.createElement('canvas');
  c.width = c.height = s;
  const cx = c.getContext('2d');
  cx.fillStyle = '#020210'; cx.fillRect(0, 0, s, s);
  cx.strokeStyle = 'rgba(40,80,200,0.85)'; cx.lineWidth = 1.5;
  cx.beginPath();
  cx.moveTo(0,0); cx.lineTo(s,0);
  cx.moveTo(0,0); cx.lineTo(0,s);
  cx.stroke();
  return new THREE.CanvasTexture(c);
}
const gridTex = makeGridTex();
gridTex.wrapS = gridTex.wrapT = THREE.RepeatWrapping;
gridTex.repeat.set(3, 55);

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(32, 600),
  new THREE.MeshLambertMaterial({ map: gridTex })
);
ground.rotation.x = -Math.PI / 2;
ground.position.set(0, 0, -270);
ground.receiveShadow = true;
scene.add(ground);

// ── Rails ─────────────────────────────────────────────────
function rail(x, color, h=0.08) {
  const m = new THREE.Mesh(
    new THREE.BoxGeometry(0.09, h, 600),
    new THREE.MeshBasicMaterial({ color })
  );
  m.position.set(x, h / 2, -270);
  scene.add(m);
}
rail(-7.8, 0x2244cc, 0.12);
rail( 7.8, 0x2244cc, 0.12);
rail(-2.5, 0x111b55, 0.06);
rail( 2.5, 0x111b55, 0.06);

// ── Decorative side towers ────────────────────────────────
for (let z = -20; z > -280; z -= 22) {
  const h = 6 + Math.random() * 12;
  for (const sx of [-13, 13]) {
    const m = new THREE.Mesh(
      new THREE.BoxGeometry(1.2, h, 1.2),
      new THREE.MeshPhongMaterial({ color: 0x0a1025, emissive: 0x050a1a })
    );
    m.position.set(sx, h / 2, z);
    scene.add(m);
    // Window glow
    const w = new THREE.Mesh(
      new THREE.BoxGeometry(0.3, 0.2, 0.1),
      new THREE.MeshBasicMaterial({ color: 0x3355bb })
    );
    w.position.set(sx > 0 ? sx - 0.7 : sx + 0.7, h * 0.6, z);
    scene.add(w);
  }
}

// ── Player ────────────────────────────────────────────────
const playerMat = new THREE.MeshPhongMaterial({
  color: 0x2255ee, emissive: 0x0a1a66, shininess: 130
});
const playerMesh = new THREE.Mesh(new THREE.BoxGeometry(3, 3, 3), playerMat);
playerMesh.position.set(0, 1.5, 0);
playerMesh.castShadow = true;
scene.add(playerMesh);

// ── Wall panels ───────────────────────────────────────────
function makeWallTex(text) {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 256;
  const cx = c.getContext('2d');
  // BG gradient
  const g = cx.createLinearGradient(0, 0, 0, 256);
  g.addColorStop(0, '#060d2a'); g.addColorStop(1, '#030816');
  cx.fillStyle = g; cx.fillRect(0, 0, 512, 256);
  // Border glow
  cx.shadowColor = '#3366ff'; cx.shadowBlur = 20;
  cx.strokeStyle = '#3366ff'; cx.lineWidth = 5;
  cx.strokeRect(4, 4, 504, 248);
  cx.shadowBlur = 0;
  cx.strokeStyle = 'rgba(80,130,255,0.2)'; cx.lineWidth = 14;
  cx.strokeRect(12, 12, 488, 232);
  // Text
  cx.fillStyle = '#ffffff';
  cx.shadowColor = 'rgba(120,180,255,0.9)'; cx.shadowBlur = 15;
  let fs = 76;
  cx.font = `bold ${fs}px Courier New`;
  while (cx.measureText(text).width > 468 && fs > 24) { fs -= 2; cx.font = `bold ${fs}px Courier New`; }
  cx.textAlign = 'center'; cx.textBaseline = 'middle';
  cx.fillText(text, 256, 128);
  return new THREE.CanvasTexture(c);
}

const wallMeshes = [];
for (let i = 0; i < 3; i++) {
  const mat = new THREE.MeshPhongMaterial({
    map: makeWallTex('?'), emissive: 0x0a1a44, emissiveIntensity: 0.4, shininess: 80
  });
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(4.7, 7, 0.5), mat);
  mesh.position.set(LANE_X[i], 3.5, WALL_START);
  mesh.castShadow = true;
  mesh.visible = false;
  scene.add(mesh);
  wallMeshes.push(mesh);
}

function updateWallTextures() {
  const q = QUESTIONS[gs.qIdx];
  for (let i = 0; i < 3; i++) {
    const t = makeWallTex(q.answers[i]);
    wallMeshes[i].material.map.dispose();
    wallMeshes[i].material.map = t;
    wallMeshes[i].material.needsUpdate = true;
  }
}

// ── UI helpers ────────────────────────────────────────────
function triggerFill(color, ms) {
  const f = document.getElementById('question-fill');
  f.style.transition = 'none'; f.style.background = color; f.style.width = '100%';
  f.getBoundingClientRect();
  f.style.transition = `width ${ms}ms linear`; f.style.width = '0%';
}
function clearFill() {
  const f = document.getElementById('question-fill');
  f.style.transition = 'none'; f.style.width = '0%';
}
function loadQ() {
  const q = QUESTIONS[gs.qIdx];
  document.getElementById('question-text').textContent = q.text;
  document.getElementById('progress').textContent = `${gs.qIdx + 1} / ${QUESTIONS.length}`;
}
function endGame(win) {
  gs.phase = 'end';
  clearFill();
  for (const m of wallMeshes) m.visible = false;
  const qi = Math.min(gs.qIdx, QUESTIONS.length - 1);
  const q  = QUESTIONS[qi];
  document.getElementById('end-title').textContent  = win ? '🎉 Complete!' : '💥 Wrong!';
  document.getElementById('end-title').style.color  = win ? '#4fffb0' : '#ff4f6a';
  document.getElementById('end-sub').textContent    = win ? 'All 5 questions done!' : `Correct: ${q.answers[q.correctIdx]}`;
  document.getElementById('end-score').textContent  = `Score: ${gs.score} / ${QUESTIONS.length}`;
  document.getElementById('end-overlay').classList.add('visible');
}
function restartGame() {
  document.getElementById('end-overlay').classList.remove('visible');
  clearFill();
  for (const m of wallMeshes) m.visible = false;
  gs = initGS();
  loadQ();
  triggerFill('rgba(79,255,176,0.38)', READ_TIME);
}

// ── Game state ────────────────────────────────────────────
let gs, lastTime;

function initGS() {
  lastTime = null;
  return {
    lane: 1, laneSmooth: 1.0,
    jumpT: 0, jumping: false, jumpY: 0,
    gridOff: 0,
    qIdx: 0, score: 0, dist: 0,
    phase: 'read',           // read | run | wall | result | end
    readTimer: READ_TIME,
    wallZ: WALL_START,
    resultTimer: 0, resultCorrect: false,
  };
}
gs = initGS();

// ── Input ─────────────────────────────────────────────────
const keys = {};
document.addEventListener('keydown', e => { keys[e.code] = true; });
document.addEventListener('keyup',   e => { keys[e.code] = false; });
let pL = false, pR = false, pS = false;

function handleInput() {
  if (gs.phase === 'end') return;
  const L = keys['ArrowLeft'] || keys['KeyA'];
  const R = keys['ArrowRight'] || keys['KeyD'];
  const S = keys['Space'];
  if (L && !pL) gs.lane = Math.max(0, gs.lane - 1);
  if (R && !pR) gs.lane = Math.min(2, gs.lane + 1);
  if (S && !pS && !gs.jumping) { gs.jumping = true; gs.jumpT = 0; }
  pL = L; pR = R; pS = S;
}

let tx0 = null, ty0 = null;
document.addEventListener('touchstart', e => { tx0 = e.touches[0].clientX; ty0 = e.touches[0].clientY; }, { passive: true });
document.addEventListener('touchend', e => {
  if (tx0 === null) return;
  const dx = e.changedTouches[0].clientX - tx0;
  const dy = e.changedTouches[0].clientY - ty0;
  if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 20) {
    if (gs.phase !== 'end') gs.lane = dx < 0 ? Math.max(0, gs.lane - 1) : Math.min(2, gs.lane + 1);
  } else if (dy < -20 || (Math.abs(dx) < 15 && Math.abs(dy) < 15)) {
    if (!gs.jumping && gs.phase !== 'end') { gs.jumping = true; gs.jumpT = 0; }
  }
  tx0 = ty0 = null;
}, { passive: true });

// ── Update ────────────────────────────────────────────────
function update(dt) {
  handleInput();
  if (gs.phase === 'end') return;

  // Smooth lane + jump
  gs.laneSmooth += (gs.lane - gs.laneSmooth) * Math.min(1, dt * 0.011);
  if (gs.jumping) {
    gs.jumpT += dt * 0.003;
    if (gs.jumpT >= 1) { gs.jumping = false; gs.jumpT = 0; }
  }
  gs.jumpY = gs.jumping ? Math.sin(gs.jumpT * Math.PI) * 5.5 : 0;

  // Grid scroll
  gs.gridOff += dt * 0.00009;
  gridTex.offset.y = gs.gridOff;

  const q = QUESTIONS[gs.qIdx];

  if (gs.phase === 'read') {
    gs.readTimer -= dt;
    if (gs.readTimer <= 0) {
      clearFill();
      gs.phase = 'run'; gs.dist = 0;
      updateWallTextures();
    }

  } else if (gs.phase === 'run') {
    gs.dist += dt;
    if (gs.dist > 2200) { // ~2.2s
      gs.phase = 'wall';
      gs.wallZ = WALL_START;
      for (const m of wallMeshes) m.visible = true;
    }

  } else if (gs.phase === 'wall') {
    gs.wallZ += WALL_SPEED * dt;
    for (let i = 0; i < 3; i++) wallMeshes[i].position.z = gs.wallZ;

    if (gs.wallZ >= 2) {
      const correct = gs.lane === q.correctIdx;
      for (const m of wallMeshes) m.visible = false;
      gs.resultCorrect = correct;

      if (correct) {
        gs.score++;
        gs.qIdx++;
        if (gs.qIdx >= QUESTIONS.length) {
          // ✅ Last question correct — end immediately, NO extra drain
          endGame(true);
          return;
        }
        loadQ(); // show NEXT question text during result drain
        gs.phase = 'result';
        gs.resultTimer = RESULT_TIME;
        triggerFill('rgba(79,255,176,0.42)', RESULT_TIME);
      } else {
        gs.phase = 'result';
        gs.resultTimer = RESULT_TIME;
        triggerFill('rgba(255,79,106,0.42)', RESULT_TIME);
      }
    }

  } else if (gs.phase === 'result') {
    gs.resultTimer -= dt;
    if (gs.resultTimer <= 0) {
      clearFill();
      if (!gs.resultCorrect) { endGame(false); return; }
      gs.phase = 'run'; gs.dist = 0;
      updateWallTextures();
    }
  }

  // Player 3D position
  const px = LANE_X[0] + gs.laneSmooth * 5; // 0→-5, 1→0, 2→5
  playerMesh.position.x = px;
  playerMesh.position.y = 1.5 + gs.jumpY;
  playerMesh.rotation.y += dt * 0.0004;

  // Player color by state
  let pc = 0x2255ee;
  if (gs.phase === 'result' && !gs.resultCorrect)
    pc = Math.floor(Date.now() / 480) % 2 === 0 ? 0xff3355 : 0x661122;
  else if (gs.phase === 'result' && gs.resultCorrect)
    pc = 0x22ddaa;

  playerMat.color.setHex(pc);
  playerMat.emissive.setHex(pc).multiplyScalar(0.28);
  playerLight.color.setHex(pc);
  playerLight.position.set(px, 1.5 + gs.jumpY - 0.5, 0);

  // Camera follows player X smoothly
  const camTargetX = px * 0.33;
  camera.position.x += (camTargetX - camera.position.x) * Math.min(1, dt * 0.007);
  camera.position.y = 9 + Math.sin(Date.now() * 0.0005) * 0.15; // gentle bob
  camera.lookAt(camTargetX * 0.5, 2.5, -10);
}

// ── Render loop ───────────────────────────────────────────
function loop(ts) {
  if (!lastTime) lastTime = ts;
  const dt = Math.min(ts - lastTime, 50);
  lastTime = ts;
  update(dt);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

// Start
loadQ();
triggerFill('rgba(79,255,176,0.38)', READ_TIME);
requestAnimationFrame(loop);
</script>
</body>
</html>
